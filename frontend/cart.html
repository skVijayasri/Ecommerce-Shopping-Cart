<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Cart</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- Top Bar -->

    <div class="top-bar">

        Support: +91 9876543210 |
        Get 25% OFF on first order

    </div>



    <!-- Navigation -->

    <nav>

        <div class="logo">
            ShopEasy
        </div>


        <ul>

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="shop.html">
                    Shop
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                    <span id="cart-count">
                        0
                    </span>
                </a>
            </li>

            <li>
                <a href="contact.html">
                    Contact
                </a>
            </li>

        </ul>

    </nav>



    <!-- Cart Header -->

    <header>

        <h1>
            Your Shopping Cart
        </h1>

        <p>
            Review your selected products
        </p>

    </header>



    <!-- Cart -->

    <main class="cart-page">


        <section class="cart-section">

            <h2>
                Cart Items
            </h2>


            <div id="cart">

                <!-- Cart items appear here -->

            </div>

        </section>



        <!-- Summary -->

        <section class="summary-section">

            <h2>
                Order Summary
            </h2>


            <p>
                Total Items:
                <span id="total-items">
                    0
                </span>
            </p>


            <p>
                Total Price:
                ₹<span id="total-price">
                    0
                </span>
            </p>


            <button
                class="checkout-btn"
                onclick="checkout()">

                Proceed to Checkout

            </button>

        </section>


    </main>



    <!-- Footer -->

    <footer>

        <h3>
            ShopEasy
        </h3>

        <p>
            Best Ecommerce Shopping
        </p>

        <p>
            Email: shopeasy@gmail.com
        </p>

        <p>
            Phone: +91 9876543210
        </p>

    </footer>



    <script src="cart.js"></script>

</body>

</html>
